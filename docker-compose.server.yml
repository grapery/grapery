version: '3.8'

services:
  # Grapery Server Service
  server:
    # 镜像地址从环境变量 IMAGE 获取，如果没有则使用默认值
    image: ${IMAGE:-grapery-server:dev}
    container_name: ${SERVICE_NAME:-server}
    restart: unless-stopped
    ports:
      - "${GRAPERY_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      # APNs .p8：CI 上传到 ./certs/apns.p8（勿用 certs/certs/；appleboy SCP 已扁平，见 server-ci）
      - ./certs:/app/certs:ro
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD", "/app/grapery-server", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  # 连接到 ngx 部署创建的 grapery-network 网络
  grapery-network:
    external: true
