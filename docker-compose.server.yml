version: '3.8'

services:
  # Grapery Server Service
  server:
    # 镜像地址从环境变量 IMAGE 获取，如果没有则使用默认值
    image: ${IMAGE:-grapery-server:dev}
    container_name: ${SERVICE_NAME:-server}
    restart: unless-stopped
    ports:
      - "${GRAPERY_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    # Agent access token（见 .env.example）：AGENT_TOKEN_SIGNING_KEY、AGENT_TOKEN_TTL_SEC、
    # AGENT_TOKEN_REPLAY_CACHE_ENABLED、AGENT_PUBLIC_PARALLEL_ENABLED、AGENT_EXEC_FRAGMENT_PANEL_ENABLED、
    # GRAPERY_INTERNAL_API_KEY
    # Apple IAP（StoreKit 2）在 VIPPay 服务配置，见 docker-compose.vippay.yml / env.vippay.example
    # Aliyun SMS：默认关闭；启用真实发送需在部署目录 .env 设置 ALIYUN_SMS_ENABLED=true，并配置 ALIYUN_SMS_SIGN_NAME、ALIYUN_SMS_TEMPLATE_CODE、
    # ALIYUN_SMS_REGION（默认 cn-hangzhou）、ALIYUN_SMS_ENDPOINT、ALIYUN_SMS_USE_DEFAULT_CREDENTIAL，
    # 非默认凭据时需 ALIYUN_SMS_ACCESS_KEY_ID / ALIYUN_SMS_ACCESS_KEY_SECRET（与 server-ci deploy 下发的 .env 一致）
    volumes:
      # APNs .p8：CI 上传到 ./certs/apns.p8（勿用 certs/certs/；appleboy SCP 已扁平，见 server-ci）
      - ./certs:/app/certs:ro
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD", "/app/grapery-server", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  # 连接到 ngx 部署创建的 grapery-network 网络
  grapery-network:
    external: true
