name: VIPPay Service CI/CD

on:
  push:
    paths:
      - 'cmd/vippay/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/vippay-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'cmd/vippay/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/vippay-ci.yml'
  # 手动触发部署
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  GO_VERSION: '1.24'
  REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-kz6w8hb0pa94yvgy.cn-hangzhou.personal.cr.aliyuncs.com' }}
  IMAGE_NAME: grapery-vippay
  SERVICE_NAME: vippay
  SERVICE_PORT: 8081

jobs:
  # ========================================
  # 构建
  # ========================================
  build:
    name: Build VIPPay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary
        run: |
          VERSION=$(echo ${{ github.sha }} | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${{ github.sha }} -X main.BuildTime=${BUILD_TIME}" \
            -o ./bin/${{ env.SERVICE_NAME }} ./cmd/${{ env.SERVICE_NAME }}
          
          echo "✅ Build completed"
          ls -lh ./bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-${{ env.SERVICE_NAME }}
          path: bin/${{ env.SERVICE_NAME }}
          retention-days: 7

  # ========================================
  # Docker 构建 - Develop 分支
  # ========================================
  docker-develop:
    name: Docker Build (Develop)
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    env:
      TAG: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f ./cmd/${{ env.SERVICE_NAME }}/Dockerfile \
            -t ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg VERSION=develop-${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # ========================================
  # Docker 构建 - Main 分支
  # ========================================
  docker-production:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    env:
      TAG: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f ./cmd/${{ env.SERVICE_NAME }}/Dockerfile \
            -t ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # ========================================
  # 部署到开发环境 - Develop 分支
  # ========================================
  deploy-develop:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-develop
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        id: envgen_vippay_dev
        env:
          APNS_PRIVATE_KEY_SECRET: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_PRIVATE_KEY_VAR: ${{ vars.APNS_PRIVATE_KEY }}
        run: |
          echo "📦 Generating development .env file..."
          APNS_PRIVATE_KEY="${APNS_PRIVATE_KEY_SECRET:-}"
          if [ -z "$APNS_PRIVATE_KEY" ]; then APNS_PRIVATE_KEY="${APNS_PRIVATE_KEY_VAR:-}"; fi
          export APNS_PRIVATE_KEY
          mkdir -p certs
          APNS_KEY_PATH_LINE=""
          if [ -n "${APNS_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$APNS_PRIVATE_KEY" > certs/apns.p8
            chmod 600 certs/apns.p8
            APNS_KEY_PATH_LINE="APNS_PRIVATE_KEY_PATH=/app/certs/apns.p8"
            echo "apns_file_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "apns_file_ready=false" >> "$GITHUB_OUTPUT"
          fi
          cat > .env << EOF
          # ========== Environment ==========
          ENVIRONMENT=development
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
          
          # ========== Server Configuration ==========
          VIPPAY_PORT=${{ env.SERVICE_PORT }}
          VIPPAY_DOMAIN=${{ vars.VIPPAY_DOMAIN || 'https://dev.grapery.xyz' }}
          LOG_LEVEL=debug
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery_dev' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Apple IAP Configuration ==========
          APPLE_BUNDLE_ID=${{ vars.APPLE_BUNDLE_ID }}
          APPLE_ISSUER_ID=${{ vars.APPLE_ISSUER_ID }}
          APPLE_KEY_ID=${{ vars.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY=${{ vars.APPLE_PRIVATE_KEY }}
          
          # ========== Apple Push (APNs) — same Repository Variables as API server ==========
          APNS_BUNDLE_ID=${{ vars.APNS_BUNDLE_ID }}
          APNS_TEAM_ID=${{ vars.APNS_TEAM_ID }}
          APNS_KEY_ID=${{ vars.APNS_KEY_ID }}
          APNS_USE_SANDBOX=${{ vars.APNS_USE_SANDBOX || 'true' }}
          $APNS_KEY_PATH_LINE
          
          # ========== Google IAP Configuration ==========
          GOOGLE_PACKAGE_NAME=${{ vars.GOOGLE_PACKAGE_NAME }}
          GOOGLE_SERVICE_ACCOUNT_KEY=${{ vars.GOOGLE_SERVICE_ACCOUNT_KEY }}
          
          # ========== Google OAuth Configuration ==========
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ vars.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ vars.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-dev' }}
          ALIYUN_ROLE_ARN=${{ vars.ALIYUN_ROLE_ARN }}
          
          # ========== Aliyun OSS STS Configuration ==========
          ALIYUN_OSS_ACCESS_KEY_ID=${{ vars.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET=${{ vars.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ROLE_ARN=${{ vars.ALIYUN_OSS_ROLE_ARN }}
          
          # ========== Aliyun SLS Telemetry Configuration ==========
          ALIYUN_ACCESS_KEY_ID=${{ vars.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET=${{ vars.ALIYUN_ACCESS_KEY_SECRET }}
          EOF
          echo "✅ Development .env file generated"
          cat .env

      - name: Deploy notification
        run: |
          echo "## 🚀 Development Deployment - VIPPay Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | development |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload .env to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/grapery/vippay/"

      - name: Upload docker-compose.vippay.yml to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: "docker-compose.vippay.yml"
          target: "/home/ubuntu/grapery/vippay/"

      - name: Flatten APNs key for SCP
        if: steps.envgen_vippay_dev.outputs.apns_file_ready == 'true'
        run: |
          cp certs/apns.p8 apns.p8
          chmod 600 apns.p8

      - name: Upload APNs key to ECS
        if: steps.envgen_vippay_dev.outputs.apns_file_ready == 'true'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: "apns.p8"
          target: "/home/ubuntu/grapery/vippay/certs/"

      - name: Remote Deploy to Development Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          script: |
            # 创建服务专用目录
            SERVICE_DIR="/home/ubuntu/grapery/vippay"
            mkdir -p "$SERVICE_DIR/certs"
            if [ -f "$SERVICE_DIR/certs/certs/apns.p8" ] && [ ! -f "$SERVICE_DIR/certs/apns.p8" ]; then
              mv "$SERVICE_DIR/certs/certs/apns.p8" "$SERVICE_DIR/certs/apns.p8"
              rmdir "$SERVICE_DIR/certs/certs" 2>/dev/null || true
            fi
            cd "$SERVICE_DIR"
            
            # 设置环境变量
            export REGISTRY=${{ env.REGISTRY }}
            export ACR_USERNAME=${{ vars.ACR_USERNAME }}
            export ACR_PASSWORD=${{ vars.ACR_PASSWORD }}
            export IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            
            # 登录阿里云 ACR
            echo "$ACR_PASSWORD" | docker login $REGISTRY -u "$ACR_USERNAME" --password-stdin
            
            # 拉取最新镜像并部署
            docker pull $IMAGE
            
            # 确保 grapery-network 网络存在（用于与其他服务通信）
            echo "🔗 Checking grapery-network..."
            docker network create grapery-network 2>/dev/null || echo "   (network already exists)"
            
            # 如果存在 docker-compose.vippay.yml，使用 docker compose 部署
            if [ -f docker-compose.vippay.yml ]; then
              echo "📦 Deploying via docker-compose.vippay.yml..."
              # 在当前服务目录中直接使用 docker compose（目录已隔离）
              echo "📋 Verifying compose file in service directory..."
              ls -la "$SERVICE_DIR"
              echo "--- docker-compose.yml content ---"
              cat docker-compose.vippay.yml
              # 先停止并清理可能存在的旧容器（使用项目名称隔离）
              docker compose -f docker-compose.vippay.yml -p grapery-vippay down 2>/dev/null || true
              # 显式指定 compose 文件，确保只使用当前服务的配置
              docker compose -f docker-compose.vippay.yml -p grapery-vippay up -d vippay
            else
              # 否则直接运行容器，连接到 grapery-network 网络
              echo "🚀 Deploying container directly..."
              docker stop ${{ env.SERVICE_NAME }} || true
              docker rm ${{ env.SERVICE_NAME }} || true
              docker run -d \
                --name ${{ env.SERVICE_NAME }} \
                --restart unless-stopped \
                --network grapery-network \
                -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
                -v "$SERVICE_DIR/certs:/app/certs:ro" \
                --env-file .env \
                ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            fi
            
            # 清理未使用的镜像
            docker system prune -f

  # ========================================
  # 部署到生产环境 - Main 分支
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-production
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        id: envgen_vippay_prod
        env:
          APNS_PRIVATE_KEY_SECRET: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_PRIVATE_KEY_VAR: ${{ vars.APNS_PRIVATE_KEY }}
        run: |
          echo "📦 Generating production .env file..."
          APNS_PRIVATE_KEY="${APNS_PRIVATE_KEY_SECRET:-}"
          if [ -z "$APNS_PRIVATE_KEY" ]; then APNS_PRIVATE_KEY="${APNS_PRIVATE_KEY_VAR:-}"; fi
          export APNS_PRIVATE_KEY
          mkdir -p certs
          APNS_KEY_PATH_LINE=""
          if [ -n "${APNS_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$APNS_PRIVATE_KEY" > certs/apns.p8
            chmod 600 certs/apns.p8
            APNS_KEY_PATH_LINE="APNS_PRIVATE_KEY_PATH=/app/certs/apns.p8"
            echo "apns_file_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "apns_file_ready=false" >> "$GITHUB_OUTPUT"
          fi
          cat > .env << EOF
          # ========== Environment ==========
          ENVIRONMENT=production
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
          
          # ========== Server Configuration ==========
          VIPPAY_PORT=${{ env.SERVICE_PORT }}
          VIPPAY_DOMAIN=${{ vars.VIPPAY_DOMAIN || 'https://www.grapery.xyz' }}
          LOG_LEVEL=info
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Apple IAP Configuration ==========
          APPLE_BUNDLE_ID=${{ vars.APPLE_BUNDLE_ID }}
          APPLE_ISSUER_ID=${{ vars.APPLE_ISSUER_ID }}
          APPLE_KEY_ID=${{ vars.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY=${{ vars.APPLE_PRIVATE_KEY }}
          
          # ========== Apple Push (APNs) — same Repository Variables as API server ==========
          APNS_BUNDLE_ID=${{ vars.APNS_BUNDLE_ID }}
          APNS_TEAM_ID=${{ vars.APNS_TEAM_ID }}
          APNS_KEY_ID=${{ vars.APNS_KEY_ID }}
          APNS_USE_SANDBOX=${{ vars.APNS_USE_SANDBOX_PROD || vars.APNS_USE_SANDBOX || 'false' }}
          $APNS_KEY_PATH_LINE
          
          # ========== Google IAP Configuration ==========
          GOOGLE_PACKAGE_NAME=${{ vars.GOOGLE_PACKAGE_NAME }}
          GOOGLE_SERVICE_ACCOUNT_KEY=${{ vars.GOOGLE_SERVICE_ACCOUNT_KEY }}
          
          # ========== Google OAuth Configuration ==========
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ vars.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ vars.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-prod' }}
          ALIYUN_ROLE_ARN=${{ vars.ALIYUN_ROLE_ARN }}
          
          # ========== Aliyun OSS STS Configuration ==========
          ALIYUN_OSS_ACCESS_KEY_ID=${{ vars.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET=${{ vars.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ROLE_ARN=${{ vars.ALIYUN_OSS_ROLE_ARN }}
          EOF
          echo "✅ Production .env file generated"
          cat .env

      - name: Deploy notification
        run: |
          echo "## 🚀 Production Deployment - VIPPay Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### vars Status" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ vars.DB_PASSWORD && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- JWT_SECRET: ${{ vars.JWT_SECRET && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- APPLE_PRIVATE_KEY: ${{ vars.APPLE_PRIVATE_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GOOGLE_PACKAGE_NAME: ${{ vars.GOOGLE_PACKAGE_NAME && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GOOGLE_SERVICE_ACCOUNT_KEY: ${{ vars.GOOGLE_SERVICE_ACCOUNT_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload .env to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 116.62.27.179
          username: root
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/grapery/vippay/"

      - name: Upload docker-compose.vippay.yml to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 116.62.27.179
          username: root
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: "docker-compose.vippay.yml"
          target: "/home/ubuntu/grapery/vippay/"

      - name: Flatten APNs key for SCP
        if: steps.envgen_vippay_prod.outputs.apns_file_ready == 'true'
        run: |
          cp certs/apns.p8 apns.p8
          chmod 600 apns.p8

      - name: Upload APNs key to ECS
        if: steps.envgen_vippay_prod.outputs.apns_file_ready == 'true'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 116.62.27.179
          username: root
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: "apns.p8"
          target: "/home/ubuntu/grapery/vippay/certs/"

      - name: Remote Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 116.62.27.179
          username: root
          key: ${{ vars.SSH_KEY }}
          port: 22
          script: |
            # 创建服务专用目录
            SERVICE_DIR="/home/ubuntu/grapery/vippay"
            mkdir -p "$SERVICE_DIR/certs"
            if [ -f "$SERVICE_DIR/certs/certs/apns.p8" ] && [ ! -f "$SERVICE_DIR/certs/apns.p8" ]; then
              mv "$SERVICE_DIR/certs/certs/apns.p8" "$SERVICE_DIR/certs/apns.p8"
              rmdir "$SERVICE_DIR/certs/certs" 2>/dev/null || true
            fi
            cd "$SERVICE_DIR"
            
            # 设置环境变量
            export REGISTRY=${{ env.REGISTRY }}
            export ACR_USERNAME=${{ vars.ACR_USERNAME }}
            export ACR_PASSWORD=${{ vars.ACR_PASSWORD }}
            export IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            
            # 登录阿里云 ACR
            echo "$ACR_PASSWORD" | docker login $REGISTRY -u "$ACR_USERNAME" --password-stdin
            
            # 拉取最新镜像并部署
            docker pull $IMAGE
            
            # 确保 grapery-network 网络存在（用于与其他服务通信）
            echo "🔗 Checking grapery-network..."
            docker network create grapery-network 2>/dev/null || echo "   (network already exists)"
            
            # 如果存在 docker-compose.vippay.yml，使用 docker compose 部署
            if [ -f docker-compose.vippay.yml ]; then
              echo "📦 Deploying via docker-compose.vippay.yml..."
              # 在当前服务目录中直接使用 docker compose（目录已隔离）
              echo "📋 Verifying compose file in service directory..."
              ls -la "$SERVICE_DIR"
              echo "--- docker-compose.yml content ---"
              cat docker-compose.vippay.yml
              # 先停止并清理可能存在的旧容器（使用项目名称隔离）
              docker compose -f docker-compose.vippay.yml -p grapery-vippay down 2>/dev/null || true
              # 显式指定 compose 文件，确保只使用当前服务的配置
              docker compose -f docker-compose.vippay.yml -p grapery-vippay up -d vippay
            else
              # 否则直接运行容器，连接到 grapery-network 网络
              echo "🚀 Deploying container directly..."
              docker stop ${{ env.SERVICE_NAME }} || true
              docker rm ${{ env.SERVICE_NAME }} || true
              docker run -d \
                --name ${{ env.SERVICE_NAME }} \
                --restart unless-stopped \
                --network grapery-network \
                -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
                -v "$SERVICE_DIR/certs:/app/certs:ro" \
                --env-file .env \
                ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            fi
            
            # 清理未使用的镜像
            docker system prune -f

