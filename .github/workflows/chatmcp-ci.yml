name: ChatMCP Service CI/CD

on:
  push:
    paths:
      - 'cmd/chatmcp/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/chatmcp-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'cmd/chatmcp/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/chatmcp-ci.yml'

env:
  GO_VERSION: '1.24'
  REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-kz6w8hb0pa94yvgy.cn-hangzhou.personal.cr.aliyuncs.com' }}
  IMAGE_NAME: grapery-chatmcp
  SERVICE_NAME: chatmcp
  SERVICE_PORT: 8082

jobs:
  # ========================================
  # 代码质量检查
  # ========================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Go fmt check
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "❌ The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: Go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m

  # ========================================
  # 测试
  # ========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: grapery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        env:
          DB_DATABASE: grapery_test
          DB_USERNAME: root
          DB_PASSWORD: testpass
          DB_ADDRESS: localhost
          REDIS_ADDRESS: localhost:6379
          REDIS_PASSWORD: ""
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRY_HOURS: "24"
          GEMINI_API_KEY: test-gemini-key
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: chatmcp
          name: grapery-chatmcp

  # ========================================
  # 构建
  # ========================================
  build:
    name: Build ChatMCP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary
        run: |
          VERSION=$(echo ${{ github.sha }} | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${{ github.sha }} -X main.BuildTime=${BUILD_TIME}" \
            -o ./bin/${{ env.SERVICE_NAME }} ./cmd/${{ env.SERVICE_NAME }}
          
          echo "✅ Build completed"
          ls -lh ./bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-${{ env.SERVICE_NAME }}
          path: bin/${{ env.SERVICE_NAME }}
          retention-days: 7

  # ========================================
  # Docker 构建 - Develop 分支
  # ========================================
  docker-develop:
    name: Docker Build (Develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      TAG: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f ./cmd/${{ env.SERVICE_NAME }}/Dockerfile \
            -t ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg VERSION=develop-${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # ========================================
  # Docker 构建 - Main 分支
  # ========================================
  docker-production:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TAG: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f ./cmd/${{ env.SERVICE_NAME }}/Dockerfile \
            -t ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # ========================================
  # 部署到开发环境 - Develop 分支
  # ========================================
  deploy-develop:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          echo "📦 Generating development .env file..."
          cat > .env << EOF
          # ========== Environment ==========
          ENVIRONMENT=development
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
          
          # ========== Server Configuration ==========
          GRAPERY_ENV=development
          GRAPERY_HTTP_PORT=${{ env.SERVICE_PORT }}
          GRAPERY_LOG_LEVEL=debug
          GRAPERY_ALLOW_ORIGIN=*
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery_dev' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ vars.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ vars.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          
          # ========== AI Configuration (Gemini required) ==========
          GEMINI_API_KEY=${{ vars.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          EOF
          echo "✅ Development .env file generated"
          cat .env

      - name: Deploy notification
        run: |
          echo "## 🚀 Development Deployment - ChatMCP Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | development |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload .env to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/grapery/"

      - name: Remote Deploy to Development Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/grapery
            
            # 设置环境变量
            export REGISTRY=${{ env.REGISTRY }}
            export ACR_USERNAME=${{ vars.ACR_USERNAME }}
            export ACR_PASSWORD=${{ vars.ACR_PASSWORD }}
            
            # 登录阿里云 ACR
            echo "$ACR_PASSWORD" | docker login $REGISTRY -u "$ACR_USERNAME" --password-stdin
            
            # 拉取最新镜像并部署
            docker pull ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            
            # 如果存在 docker-compose.yml，使用 docker compose 部署
            if [ -f docker-compose.yml ]; then
              docker compose up -d ${{ env.SERVICE_NAME }}
            else
              # 否则直接运行容器
              docker stop ${{ env.SERVICE_NAME }} || true
              docker rm ${{ env.SERVICE_NAME }} || true
              docker run -d \
                --name ${{ env.SERVICE_NAME }} \
                --restart unless-stopped \
                -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
                --env-file .env \
                ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            fi
            
            # 清理未使用的镜像
            docker system prune -f

  # ========================================
  # 部署到生产环境 - Main 分支
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          echo "📦 Generating production .env file..."
          cat > .env << EOF
          # ========== Environment ==========
          ENVIRONMENT=production
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
          
          # ========== Server Configuration ==========
          GRAPERY_ENV=production
          GRAPERY_HTTP_PORT=${{ env.SERVICE_PORT }}
          GRAPERY_LOG_LEVEL=info
          GRAPERY_ALLOW_ORIGIN=${{ vars.GRAPERY_ALLOW_ORIGIN || '*' }}
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ vars.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ vars.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          
          # ========== AI Configuration (Gemini required) ==========
          GEMINI_API_KEY=${{ vars.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          EOF
          echo "✅ Production .env file generated"
          cat .env

      - name: Deploy notification
        run: |
          echo "## 🚀 Production Deployment - ChatMCP Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secrets Status" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ vars.DB_PASSWORD && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- JWT_SECRET: ${{ vars.JWT_SECRET && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload .env to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/grapery/"

      - name: Remote Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/grapery
            
            # 设置环境变量
            export REGISTRY=${{ env.REGISTRY }}
            export ACR_USERNAME=${{ vars.ACR_USERNAME }}
            export ACR_PASSWORD=${{ vars.ACR_PASSWORD }}
            
            # 登录阿里云 ACR
            echo "$ACR_PASSWORD" | docker login $REGISTRY -u "$ACR_USERNAME" --password-stdin
            
            # 拉取最新镜像并部署
            docker pull ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            
            # 如果存在 docker-compose.yml，使用 docker compose 部署
            if [ -f docker-compose.yml ]; then
              docker compose up -d ${{ env.SERVICE_NAME }}
            else
              # 否则直接运行容器
              docker stop ${{ env.SERVICE_NAME }} || true
              docker rm ${{ env.SERVICE_NAME }} || true
              docker run -d \
                --name ${{ env.SERVICE_NAME }} \
                --restart unless-stopped \
                -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
                --env-file .env \
                ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            fi
            
            # 清理未使用的镜像
            docker system prune -f

