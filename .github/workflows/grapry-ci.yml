name: grapery-backend-ci

on:
  push:
    paths:
      - 'grapery/**'
      - '.github/workflows/grapery-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'grapery/**'
      - '.github/workflows/grapery-ci.yml'

env:
  GO_VERSION: '1.22'
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/grapery
  
  # ========== 应用配置环境变量 ==========
  # Server config
  GRAPERY_ENV: ${{ vars.GRAPERY_ENV || 'production' }}
  GRAPERY_HTTP_PORT: ${{ vars.GRAPERY_HTTP_PORT || '8080' }}
  GRAPERY_LOG_LEVEL: ${{ vars.GRAPERY_LOG_LEVEL || 'info' }}
  GRAPERY_ALLOW_ORIGIN: ${{ vars.GRAPERY_ALLOW_ORIGIN || '*' }}

jobs:
  # 代码质量检查
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: grapery/go.sum

      - name: Go fmt check
        working-directory: grapery
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "❌ The following files need formatting:"
            echo "$fmt_output"
            echo ""
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: Go vet
        working-directory: grapery
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      - name: Run golangci-lint
        working-directory: grapery
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m

  # 测试
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: grapery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: grapery/go.sum

      - name: Run tests
        working-directory: grapery
        env:
          # 测试环境数据库配置
          DATABASE_URL: "root:testpass@tcp(localhost:3306)/grapery_test?parseTime=true"
          REDIS_URL: "localhost:6379"
          DB_DATABASE: grapery_test
          DB_USERNAME: root
          DB_PASSWORD: testpass
          DB_ADDRESS: localhost
          REDIS_ADDRESS: localhost:6379
          REDIS_PASSWORD: ""
          # 测试环境 JWT 配置
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRY_HOURS: "24"
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./grapery/coverage.out
          flags: backend
          name: grapery-backend

  # 构建所有服务
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: grapery/go.sum

      - name: Build all binaries
        working-directory: grapery
        run: |
          echo "🔨 Building server..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ./bin/server ./cmd/server
          
          echo "🔨 Building chatmcp..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ./bin/chatmcp ./cmd/chatmcp
          
          echo "🔨 Building vippay..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ./bin/vippay ./cmd/vippay
          
          echo "✅ All binaries built successfully"
          ls -lh ./bin/

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-server
          path: grapery/bin/server
          retention-days: 7

      - name: Upload chatmcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-chatmcp
          path: grapery/bin/chatmcp
          retention-days: 7

      - name: Upload vippay artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-vippay
          path: grapery/bin/vippay
          retention-days: 7

  # Docker 构建和发布 - 主服务
  docker-server:
    name: Docker Build - Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./grapery/Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Docker 构建和发布 - Agent Chat 服务
  docker-chatmcp:
    name: Docker Build - ChatMCP
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-chatmcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push chatmcp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./grapery/Dockerfile
          target: chatmcp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Docker 构建和发布 - VIP Pay 服务
  docker-vippay:
    name: Docker Build - VIPPay
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-vippay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push vippay image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./grapery/Dockerfile
          target: vippay
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 构建摘要
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [docker-server, docker-chatmcp, docker-vippay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Build summary
        run: |
          echo "## 🐳 Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server | \`${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-server:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ChatMCP | \`${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-chatmcp:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VIPPay | \`${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-vippay:latest\` |" >> $GITHUB_STEP_SUMMARY

  # 部署到生产环境
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-server, docker-chatmcp, docker-vippay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment config
        run: |
          echo "Creating deployment configuration..."
          cat > deploy-config.env << 'EOF'
          # ========== Server Configuration ==========
          GRAPERY_ENV=${{ vars.GRAPERY_ENV || 'production' }}
          GRAPERY_HTTP_PORT=${{ vars.GRAPERY_HTTP_PORT || '8080' }}
          GRAPERY_LOG_LEVEL=${{ vars.GRAPERY_LOG_LEVEL || 'info' }}
          GRAPERY_ALLOW_ORIGIN=${{ vars.GRAPERY_ALLOW_ORIGIN || '*' }}
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery' }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ADDRESS=${{ secrets.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ secrets.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          REDIS_PING_INTERVAL=${{ vars.REDIS_PING_INTERVAL || '30' }}
          
          # ========== AI Configuration ==========
          HUOSHAN_API_KEY=${{ secrets.HUOSHAN_API_KEY }}
          HUOSHAN_BASE_URL=${{ vars.HUOSHAN_BASE_URL }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          AI_DEFAULT_PROVIDER=${{ vars.AI_DEFAULT_PROVIDER || 'huoshan' }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ secrets.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ secrets.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-dev' }}
          ALIYUN_ROLE_ARN=${{ secrets.ALIYUN_ROLE_ARN }}
          
          # ========== VIPPay Configuration ==========
          VIPPAY_PORT=${{ vars.VIPPAY_PORT || '8081' }}
          VIPPAY_DOMAIN=${{ vars.VIPPAY_DOMAIN || 'https://www.grapery.xyz' }}
          
          # ========== ChatMCP Configuration ==========
          CHATMCP_PORT=${{ vars.CHATMCP_PORT || '8082' }}
          
          # ========== Apple IAP Configuration ==========
          APPLE_BUNDLE_ID=${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_ISSUER_ID=${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}
          
          # ========== Google IAP Configuration ==========
          GOOGLE_PACKAGE_NAME=${{ secrets.GOOGLE_PACKAGE_NAME }}
          GOOGLE_SERVICE_ACCOUNT_KEY=${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "✅ Deployment config created"

      - name: Deploy notification
        run: |
          echo "## 🚀 Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Port | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Server | 8080 | \`${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-server:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ChatMCP | 8082 | \`${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-chatmcp:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VIPPay | 8081 | \`${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-vippay:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ vars.GRAPERY_ENV || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Log Level | ${{ vars.GRAPERY_LOG_LEVEL || 'info' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Provider | ${{ vars.AI_DEFAULT_PROVIDER || 'huoshan' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OSS Bucket | ${{ vars.ALIYUN_BUCKET || 'grapery-dev' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secrets Status" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ secrets.DB_PASSWORD && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- JWT_SECRET: ${{ secrets.JWT_SECRET && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GOOGLE_PACKAGE_NAME: ${{ secrets.GOOGLE_PACKAGE_NAME && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY

      # 如果使用 Docker Compose 部署，可以添加以下步骤
      # - name: Deploy with Docker Compose
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /opt/grapery
      #       docker compose pull
      #       docker compose up -d --remove-orphans
      #       docker system prune -f
