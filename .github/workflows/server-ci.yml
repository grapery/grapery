name: Server Service CI/CD

on:
  push:
    paths:
      - 'cmd/server/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'cmd/server/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-ci.yml'
  # 手动触发部署
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  GO_VERSION: '1.24'
  REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-kz6w8hb0pa94yvgy.cn-hangzhou.personal.cr.aliyuncs.com' }}
  IMAGE_NAME: grapery-server
  SERVICE_NAME: server
  SERVICE_PORT: 8080

jobs:
  # ========================================
  # 构建
  # ========================================
  build:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary
        run: |
          VERSION=$(echo ${{ github.sha }} | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${{ github.sha }} -X main.BuildTime=${BUILD_TIME}" \
            -o ./bin/${{ env.SERVICE_NAME }} ./cmd/${{ env.SERVICE_NAME }}
          
          echo "✅ Build completed"
          ls -lh ./bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-${{ env.SERVICE_NAME }}
          path: bin/${{ env.SERVICE_NAME }}
          retention-days: 7

  # ========================================
  # Docker 构建 - Develop 分支
  # ========================================
  docker-develop:
    name: Docker Build (Develop)
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    env:
      TAG: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f ./cmd/${{ env.SERVICE_NAME }}/Dockerfile \
            -t ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg VERSION=develop-${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # ========================================
  # Docker 构建 - Main 分支
  # ========================================
  docker-production:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    env:
      TAG: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f ./cmd/${{ env.SERVICE_NAME }}/Dockerfile \
            -t ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:${{ env.TAG }}

  # ========================================
  # 部署到开发环境 - Develop 分支
  # ========================================
  deploy-develop:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-develop
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          echo "📦 Generating development .env file..."
          cat > .env << EOF
          # ========== Environment ==========
          ENVIRONMENT=development
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
          
          # ========== Server Configuration ==========
          GRAPERY_ENV=development
          GRAPERY_HTTP_PORT=${{ env.SERVICE_PORT }}
          GRAPERY_LOG_LEVEL=debug
          GRAPERY_ALLOW_ORIGIN=*
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery_dev' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ vars.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ vars.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          
          # ========== AI Configuration ==========
          HUOSHAN_API_KEY=${{ vars.HUOSHAN_API_KEY }}
          HUOSHAN_BASE_URL=${{ vars.HUOSHAN_BASE_URL }}
          GEMINI_API_KEY=${{ vars.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          AI_DEFAULT_PROVIDER=${{ vars.AI_DEFAULT_PROVIDER || 'huoshan' }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ vars.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ vars.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-dev' }}
          ALIYUN_ROLE_ARN=${{ vars.ALIYUN_ROLE_ARN }}
          EOF
          echo "✅ Development .env file generated"
          cat .env

      - name: Deploy notification
        run: |
          echo "## 🚀 Development Deployment - Server Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | development |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload .env to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/grapery/"

      - name: Upload docker-compose.server.yml to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: "docker-compose.server.yml"
          target: "/home/ubuntu/grapery/"

      - name: Remote Deploy to Development Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/grapery
            
            # 设置环境变量
            export REGISTRY=${{ env.REGISTRY }}
            export ACR_USERNAME=${{ vars.ACR_USERNAME }}
            export ACR_PASSWORD=${{ vars.ACR_PASSWORD }}
            export IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            
            # 登录阿里云 ACR
            echo "$ACR_PASSWORD" | docker login $REGISTRY -u "$ACR_USERNAME" --password-stdin
            
            # 拉取最新镜像并部署
            docker pull $IMAGE
            
            # 确保 grapery-network 网络存在（用于与其他服务通信）
            echo "🔗 Checking grapery-network..."
            docker network create grapery-network 2>/dev/null || echo "   (network already exists)"
            
            # 如果存在 docker-compose.server.yml，使用 docker compose 部署
            if [ -f docker-compose.server.yml ]; then
              echo "📦 Deploying via docker-compose.server.yml..."
              # 先停止并删除当前服务的旧容器（避免影响其他服务）
              docker stop ${{ env.SERVICE_NAME }} 2>/dev/null || echo "   (no existing container)"
              docker rm ${{ env.SERVICE_NAME }} 2>/dev/null || echo "   (container already removed)"
              # 创建临时目录并复制 compose 文件，避免 Docker Compose 扫描其他文件
              TEMP_DIR=$(mktemp -d)
              cp docker-compose.server.yml "$TEMP_DIR/docker-compose.yml"
              cp .env "$TEMP_DIR/.env" 2>/dev/null || true
              # 验证临时目录中的文件
              echo "📋 Verifying compose file in temp directory..."
              ls -la "$TEMP_DIR"
              echo "--- docker-compose.yml content ---"
              cat "$TEMP_DIR/docker-compose.yml"
              # 使用临时目录运行 docker compose，确保只使用指定的文件
              # 切换到临时目录，确保 Docker Compose 不会扫描其他文件
              cd "$TEMP_DIR"
              docker compose -p grapery-server up -d server
              cd /home/ubuntu/grapery
              rm -rf "$TEMP_DIR"
            else
              # 否则直接运行容器，连接到 grapery-network 网络
              echo "🚀 Deploying container directly..."
              docker stop ${{ env.SERVICE_NAME }} || true
              docker rm ${{ env.SERVICE_NAME }} || true
              docker run -d \
                --name ${{ env.SERVICE_NAME }} \
                --restart unless-stopped \
                --network grapery-network \
                -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
                --env-file .env \
                ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            fi
            
            # 清理未使用的镜像
            docker system prune -f

  # ========================================
  # 部署到生产环境 - Main 分支
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-production
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          echo "📦 Generating production .env file..."
          cat > .env << EOF
          # ========== Environment ==========
          ENVIRONMENT=production
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
          
          # ========== Server Configuration ==========
          GRAPERY_ENV=production
          GRAPERY_HTTP_PORT=${{ env.SERVICE_PORT }}
          GRAPERY_LOG_LEVEL=info
          GRAPERY_ALLOW_ORIGIN=${{ vars.GRAPERY_ALLOW_ORIGIN || '*' }}
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ vars.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ vars.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          REDIS_PING_INTERVAL=${{ vars.REDIS_PING_INTERVAL || '30' }}
          
          # ========== AI Configuration ==========
          HUOSHAN_API_KEY=${{ vars.HUOSHAN_API_KEY }}
          HUOSHAN_BASE_URL=${{ vars.HUOSHAN_BASE_URL }}
          GEMINI_API_KEY=${{ vars.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          AI_DEFAULT_PROVIDER=${{ vars.AI_DEFAULT_PROVIDER || 'huoshan' }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ vars.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ vars.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-prod' }}
          ALIYUN_ROLE_ARN=${{ vars.ALIYUN_ROLE_ARN }}
          EOF
          echo "✅ Production .env file generated"
          cat .env

      - name: Deploy notification
        run: |
          echo "## 🚀 Production Deployment - Server Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secrets Status" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ vars.DB_PASSWORD && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- JWT_SECRET: ${{ vars.JWT_SECRET && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload .env to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: ".env"
          target: "/home/ubuntu/grapery/"

      - name: Upload docker-compose.server.yml to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          source: "docker-compose.server.yml"
          target: "/home/ubuntu/grapery/"

      - name: Remote Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/grapery
            
            # 设置环境变量
            export REGISTRY=${{ env.REGISTRY }}
            export ACR_USERNAME=${{ vars.ACR_USERNAME }}
            export ACR_PASSWORD=${{ vars.ACR_PASSWORD }}
            export IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            
            # 登录阿里云 ACR
            echo "$ACR_PASSWORD" | docker login $REGISTRY -u "$ACR_USERNAME" --password-stdin
            
            # 拉取最新镜像并部署
            docker pull $IMAGE
            
            # 确保 grapery-network 网络存在（用于与其他服务通信）
            echo "🔗 Checking grapery-network..."
            docker network create grapery-network 2>/dev/null || echo "   (network already exists)"
            
            # 如果存在 docker-compose.server.yml，使用 docker compose 部署
            if [ -f docker-compose.server.yml ]; then
              echo "📦 Deploying via docker-compose.server.yml..."
              # 先停止并删除当前服务的旧容器（避免影响其他服务）
              docker stop ${{ env.SERVICE_NAME }} 2>/dev/null || echo "   (no existing container)"
              docker rm ${{ env.SERVICE_NAME }} 2>/dev/null || echo "   (container already removed)"
              # 创建临时目录并复制 compose 文件，避免 Docker Compose 扫描其他文件
              TEMP_DIR=$(mktemp -d)
              cp docker-compose.server.yml "$TEMP_DIR/docker-compose.yml"
              cp .env "$TEMP_DIR/.env" 2>/dev/null || true
              # 验证临时目录中的文件
              echo "📋 Verifying compose file in temp directory..."
              ls -la "$TEMP_DIR"
              echo "--- docker-compose.yml content ---"
              cat "$TEMP_DIR/docker-compose.yml"
              # 使用临时目录运行 docker compose，确保只使用指定的文件
              # 切换到临时目录，确保 Docker Compose 不会扫描其他文件
              cd "$TEMP_DIR"
              docker compose -p grapery-server up -d server
              cd /home/ubuntu/grapery
              rm -rf "$TEMP_DIR"
            else
              # 否则直接运行容器，连接到 grapery-network 网络
              echo "🚀 Deploying container directly..."
              docker stop ${{ env.SERVICE_NAME }} || true
              docker rm ${{ env.SERVICE_NAME }} || true
              docker run -d \
                --name ${{ env.SERVICE_NAME }} \
                --restart unless-stopped \
                --network grapery-network \
                -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
                --env-file .env \
                ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            fi
            
            # 清理未使用的镜像
            docker system prune -f

