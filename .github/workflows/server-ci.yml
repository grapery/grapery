name: Server Service CI/CD

on:
  push:
    paths:
      - 'cmd/server/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'cmd/server/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-ci.yml'

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/grapery-server
  SERVICE_NAME: server
  SERVICE_PORT: 8080

jobs:
  # ========================================
  # 代码质量检查
  # ========================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Go fmt check
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "❌ The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: Go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m

  # ========================================
  # 测试
  # ========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: grapery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        env:
          DB_DATABASE: grapery_test
          DB_USERNAME: root
          DB_PASSWORD: testpass
          DB_ADDRESS: localhost
          REDIS_ADDRESS: localhost:6379
          REDIS_PASSWORD: ""
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRY_HOURS: "24"
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: server
          name: grapery-server

  # ========================================
  # 构建
  # ========================================
  build:
    name: Build Server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary
        run: |
          VERSION=$(echo ${{ github.sha }} | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${{ github.sha }} -X main.BuildTime=${BUILD_TIME}" \
            -o ./bin/${{ env.SERVICE_NAME }} ./cmd/${{ env.SERVICE_NAME }}
          
          echo "✅ Build completed"
          ls -lh ./bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapery-${{ env.SERVICE_NAME }}
          path: bin/${{ env.SERVICE_NAME }}
          retention-days: 7

  # ========================================
  # Docker 构建 - Develop 分支
  # ========================================
  docker-develop:
    name: Docker Build (Develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=dev-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cmd/${{ env.SERVICE_NAME }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=develop-${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Docker 构建 - Main 分支
  # ========================================
  docker-production:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cmd/${{ env.SERVICE_NAME }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # 部署到开发环境 - Develop 分支
  # ========================================
  deploy-develop:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment config
        run: |
          echo "📦 Creating development deployment configuration..."
          cat > deploy-config.env << 'EOF'
          # ========== Environment ==========
          ENVIRONMENT=development
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          
          # ========== Server Configuration ==========
          GRAPERY_ENV=development
          GRAPERY_HTTP_PORT=${{ env.SERVICE_PORT }}
          GRAPERY_LOG_LEVEL=debug
          GRAPERY_ALLOW_ORIGIN=*
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery_dev' }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ADDRESS=${{ secrets.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ secrets.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          
          # ========== AI Configuration ==========
          HUOSHAN_API_KEY=${{ secrets.HUOSHAN_API_KEY }}
          HUOSHAN_BASE_URL=${{ vars.HUOSHAN_BASE_URL }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          AI_DEFAULT_PROVIDER=${{ vars.AI_DEFAULT_PROVIDER || 'huoshan' }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ secrets.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ secrets.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-dev' }}
          ALIYUN_ROLE_ARN=${{ secrets.ALIYUN_ROLE_ARN }}
          EOF
          echo "✅ Development deployment config created"

      - name: Deploy notification
        run: |
          echo "## 🚀 Development Deployment - Server Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | development |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      # 添加实际部署步骤（如 SSH 部署）
      # - name: Deploy to development server
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.DEV_DEPLOY_HOST }}
      #     username: ${{ secrets.DEV_DEPLOY_USER }}
      #     key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /opt/grapery
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
      #       docker compose up -d server
      #       docker system prune -f

  # ========================================
  # 部署到生产环境 - Main 分支
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment config
        run: |
          echo "📦 Creating production deployment configuration..."
          cat > deploy-config.env << 'EOF'
          # ========== Environment ==========
          ENVIRONMENT=production
          SERVICE_NAME=${{ env.SERVICE_NAME }}
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # ========== Server Configuration ==========
          GRAPERY_ENV=production
          GRAPERY_HTTP_PORT=${{ env.SERVICE_PORT }}
          GRAPERY_LOG_LEVEL=info
          GRAPERY_ALLOW_ORIGIN=${{ vars.GRAPERY_ALLOW_ORIGIN || '*' }}
          
          # ========== Database Configuration ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery' }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ADDRESS=${{ secrets.DB_ADDRESS }}
          
          # ========== Redis Configuration ==========
          REDIS_ADDRESS=${{ secrets.REDIS_ADDRESS }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DATABASE=${{ vars.REDIS_DATABASE || '0' }}
          REDIS_PING_INTERVAL=${{ vars.REDIS_PING_INTERVAL || '30' }}
          
          # ========== AI Configuration ==========
          HUOSHAN_API_KEY=${{ secrets.HUOSHAN_API_KEY }}
          HUOSHAN_BASE_URL=${{ vars.HUOSHAN_BASE_URL }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL=${{ vars.GEMINI_BASE_URL }}
          AI_DEFAULT_PROVIDER=${{ vars.AI_DEFAULT_PROVIDER || 'huoshan' }}
          
          # ========== JWT Configuration ==========
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_HOURS=${{ vars.JWT_EXPIRY_HOURS || '24' }}
          
          # ========== Aliyun OSS Configuration ==========
          ALIYUN_API_KEY=${{ secrets.ALIYUN_API_KEY }}
          ALIYUN_SECRET_KEY=${{ secrets.ALIYUN_SECRET_KEY }}
          ALIYUN_ENDPOINT=${{ vars.ALIYUN_ENDPOINT || 'oss-cn-shanghai.aliyuncs.com' }}
          ALIYUN_BUCKET=${{ vars.ALIYUN_BUCKET || 'grapery-prod' }}
          ALIYUN_ROLE_ARN=${{ secrets.ALIYUN_ROLE_ARN }}
          EOF
          echo "✅ Production deployment config created"

      - name: Deploy notification
        run: |
          echo "## 🚀 Production Deployment - Server Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secrets Status" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ secrets.DB_PASSWORD && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- JWT_SECRET: ${{ secrets.JWT_SECRET && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY
          echo "- ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY && '✅ Set' || '❌ Not Set' }}" >> $GITHUB_STEP_SUMMARY

      # 添加实际部署步骤（如 SSH 部署）
