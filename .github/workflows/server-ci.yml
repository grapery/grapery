      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.PROD_DEPLOY_HOST }}
      #     username: ${{ secrets.PROD_DEPLOY_USER }}
      #     key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /opt/grapery
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      #       docker compose up -d server
