# 视频生成Provider配置示例
# 复制此文件为 video_providers.yaml 并填入真实的API密钥

providers:
  # Hailuo (海螺视频) - MiniMax
  hailuo:
    enabled: true
    api_key: "${HAILUO_API_KEY}"  # 从环境变量读取
    base_url: "https://api.minimax.com"
    model: "MiniMax-Hailuo-02"
    image_model: "image-01"
    timeout: 30s
    max_retries: 3
    # 可选配置
    options:
      prompt_optimizer: true      # 启用提示词优化
      fast_pretreatment: false    # 快速预处理
      aigc_watermark: false       # 添加水印
    # 费用限制
    limits:
      daily_tokens: 100000        # 每日Token限额
      concurrent_tasks: 10        # 最大并发任务数

  # Huoshan (火山引擎) - 豆包
  huoshan:
    enabled: true
    api_key: "${HUOSHAN_API_KEY}"
    base_url: "https://open.byteplusapi.com"
    image_base_url: "https://ark.cn-beijing.volces.com/api/v3"
    workflow: "doubao-seedance-1-0-pro-250528"  # 视频模型
    image_model: "doubao-seedream-4-0-250828"   # 图片模型
    timeout: 30s
    max_retries: 3
    # 可选配置
    options:
      guidance_scale: 7.5
      watermark: false
    limits:
      daily_tokens: 150000
      concurrent_tasks: 15

  # Gemini (Google)
  gemini:
    enabled: false  # 默认禁用，需要时启用
    api_key: "${GEMINI_API_KEY}"
    model: "veo-001"              # 视频模型
    image_model: "gemini-2.5-flash-image"  # 图片模型
    timeout: 60s                  # Gemini通常需要更长时间
    max_retries: 2
    # Google Cloud配置（如果使用Vertex AI）
    project: "your-project-id"
    location: "us-central1"
    # 可选配置
    options:
      safety_filter_level: "BLOCK_MEDIUM_AND_ABOVE"
      person_generation: "ALLOW_ADULT"
    limits:
      daily_tokens: 50000
      concurrent_tasks: 5

# 全局配置
global:
  # 默认provider选择策略
  default_provider: "hailuo"
  
  # Fallback策略（按优先级排序）
  fallback_providers:
    - "hailuo"
    - "huoshan"
    - "gemini"
  
  # 根据用户等级选择provider
  user_level_mapping:
    free: "huoshan"      # 免费用户
    standard: "hailuo"   # 标准用户
    premium: "gemini"    # 高级用户
  
  # 任务配置
  task:
    queue_name: "video"
    max_retry: 3
    timeout: "5m"
    concurrency: 10      # Asynq worker并发数
  
  # Redis配置
  redis:
    addr: "${REDIS_ADDR:localhost:6379}"
    password: "${REDIS_PASSWORD:}"
    db: 0
  
  # 监控配置
  monitoring:
    enabled: true
    metrics_port: 9090
    log_level: "info"
  
  # Token使用统计
  token_usage:
    enabled: true
    record_to_database: true
    alert_threshold: 90  # 达到90%限额时告警

# 运行时配置
runtime:
  # 生成参数默认值
  defaults:
    duration: 6          # 默认视频时长（秒）
    aspect_ratio: "16:9" # 默认宽高比
    quality: "high"      # 默认质量
    
  # 参数限制
  limits:
    max_duration: 10     # 最大视频时长
    max_prompt_length: 2000  # 最大提示词长度
    
  # 自动优化
  auto_optimization:
    enabled: true
    optimize_prompt: true     # 自动优化提示词
    adjust_parameters: true   # 自动调整参数

# 示例使用场景配置
scenarios:
  # 场景1：快速预览
  quick_preview:
    provider: "huoshan"
    duration: 3
    quality: "medium"
    
  # 场景2：高质量输出
  high_quality:
    provider: "gemini"
    duration: 6
    quality: "high"
    
  # 场景3：批量生成
  batch_generation:
    provider: "hailuo"
    concurrent_limit: 20
    timeout: "10m"

# 环境变量说明
# 
# 必需的环境变量:
# - HAILUO_API_KEY:  Hailuo API密钥
# - HUOSHAN_API_KEY: Huoshan API密钥
# - GEMINI_API_KEY:  Gemini API密钥（可选）
# - REDIS_ADDR:      Redis地址（默认: localhost:6379）
# - REDIS_PASSWORD:  Redis密码（可选）
#
# 设置示例:
#   export HAILUO_API_KEY="your-hailuo-key"
#   export HUOSHAN_API_KEY="your-huoshan-key"
#   export REDIS_ADDR="localhost:6379"

