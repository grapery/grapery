version: '3.8'

services:
  # Grapery VIPPay Service
  vippay:
    # 镜像地址从环境变量 IMAGE 获取，如果没有则使用默认值
    image: ${IMAGE:-grapery-vippay:dev}
    container_name: ${SERVICE_NAME:-vippay}
    restart: unless-stopped
    ports:
      - "${VIPPAY_PORT:-8081}:8081"
    env_file:
      # CI：vippay-ci.yml 从 GitHub Variables 生成 .env 并 SCP 到 ECS
      #   APPLE_BUNDLE_ID, APPLE_ISSUER_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY（StoreKit 2 验单）
      #   WECHAT_APP_ID, WECHAT_APP_SECRET, GOOGLE_CLIENT_ID, JWT_SECRET, DB_* …
      # 本地：cp env.vippay.example .env 并填入上述项（.p8 私钥可用 docker compose 多行 << 语法）
      - .env
    volumes:
      # APNs：CI 上传到 ./certs/apns.p8（与 server 相同扁平路径，见 vippay-ci）
      - ./certs:/app/certs:ro
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD", "/app/grapery-vippay", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  # 连接到 ngx 部署创建的 grapery-network 网络
  grapery-network:
    external: true
